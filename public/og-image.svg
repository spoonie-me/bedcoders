<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bedcoders — a coding school for people who learn lying down">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#1a0f1a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top label -->
  <text x="100" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7dd3fc" letter-spacing="4">
    BEDCODERS.COM
  </text>

  <!-- Main headline -->
  <text x="100" y="260" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    A coding school for
  </text>
  <text x="100" y="335" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="url(#signal)">
    people who learn lying down.
  </text>

  <!-- Subhead -->
  <text x="100" y="410" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" fill="#a3a3a3">
    POTS · ME/CFS · Fibromyalgia · Long COVID · EDS
  </text>

  <!-- Footer row -->
  <text x="100" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#737373">
    15-min lessons  ·  no streak penalties  ·  €12/month
  </text>
  <text x="100" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#737373">
    Claude API · prompt engineering · agents
  </text>

  <!-- Bed-sun corner motif -->
  <g transform="translate(1000,420)" opacity="0.85">
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#signal)" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="-90" y1="0" x2="-75" y2="0" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="75" y1="0" x2="90" y2="0" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="0" y1="-90" x2="0" y2="-75" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="0" y1="75" x2="0" y2="90" stroke="#7dd3fc" stroke-width="2"/>
  </g>
</svg>
