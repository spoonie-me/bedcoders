<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Soft Reset School — income built from inside the illness, not after it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211C17"/>
      <stop offset="50%" stop-color="#2A241D"/>
      <stop offset="100%" stop-color="#1A150F"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D69A44"/>
      <stop offset="100%" stop-color="#C97A63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#D69A44" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D69A44" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EDE6DB" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="#EDE6DB" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top label -->
  <text x="100" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#D69A44" letter-spacing="4">
    SOFTRESET.SCHOOL
  </text>

  <!-- Main headline -->
  <text x="100" y="260" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" fill="#EDE6DB">
    You don't need a hard reboot.
  </text>
  <text x="100" y="335" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" fill="url(#signal)">
    You need a soft one.
  </text>

  <!-- Subhead -->
  <text x="100" y="410" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" fill="#B8AD9C">
    AI-era income for bed- and home-ridden chronically ill people
  </text>

  <!-- Footer row -->
  <text x="100" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8C8375">
    AI-enabled or AI-resistant  ·  no streak penalties  ·  €12/month
  </text>
  <text x="100" y="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8C8375">
    machines handle information. humans handle transformation.
  </text>

  <!-- Soft-reset wave motif (matches the hero canvas) -->
  <g transform="translate(1000,500)" opacity="0.9">
    <path d="M -140 0 C -110 0, -98 -40, -74 -40 C -50 -40, -50 32, -26 32 C -2 32, 8 0, 35 0"
          fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="0" r="7" fill="#D69A44"/>
  </g>
</svg>
