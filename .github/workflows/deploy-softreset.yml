# Deploys softreset.school to Vercel from GitHub Actions.
#
# WHY THIS EXISTS
# The site was previously deployed by CLI from a laptop that has since died, and the
# Vercel project's Git connection was deliberately disconnected after a wrong-branch
# deploy incident (see README on main). This workflow is the replacement deploy path:
# explicit, branch-pinned, and runnable from a phone via the Actions tab.
#
# SETUP (two secrets, addable from a phone)
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     VERCEL_TOKEN       a token from https://vercel.com/account/tokens
#     VERCEL_PROJECT_ID  Vercel dashboard -> the softreset.school project ->
#                        Settings -> General -> "Project ID" (starts with prj_)
#
# USAGE
#   Actions tab -> "Deploy softreset.school to Vercel" -> Run workflow.
#   Runs on the production-soft-reset-school branch ONLY — the guard below refuses
#   anything else so the Bedcoders code on main can never deploy over the live site.

name: Deploy softreset.school to Vercel

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production deployment of softreset.school'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-softreset-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_HgSMkabNBc337lj4Lba5RNyE
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Refuse to run without explicit confirmation
        if: ${{ inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error::You must type DEPLOY in the confirmation box to deploy production."
          exit 1

      - name: Refuse to deploy any branch except production-soft-reset-school
        if: ${{ github.ref != 'refs/heads/production-soft-reset-school' }}
        run: |
          echo "::error::This workflow deploys softreset.school and may ONLY run from the"
          echo "::error::production-soft-reset-school branch. You ran it from: ${{ github.ref }}"
          echo "::error::(In the Run workflow dropdown, pick production-soft-reset-school.)"
          exit 1

      - name: Verify secrets are present
        run: |
          missing=0
          [ -z "$VERCEL_TOKEN" ] && { echo "::error::VERCEL_TOKEN secret is not set."; missing=1; }
          [ -z "$VERCEL_PROJECT_ID" ] && { echo "::error::VERCEL_PROJECT_ID secret is not set."; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build locally first so a broken build never reaches Vercel
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel (production)
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tee deploy-url.txt
          echo "Deployed: $(tail -1 deploy-url.txt)"
