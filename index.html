    <!-- Structured data: FAQ (rich result eligibility) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Bedcoders a real coding bootcamp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — but a slow one, on purpose. We teach the same technical content as any AI/coding bootcamp (JavaScript, the Claude API, prompt engineering, agent design), packaged into 15-minute lessons you can do horizontally on a bad day. There are no live sessions you have to make, no streak penalties, and no good day required."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Bedcoders for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "People with chronic illness who want to learn to ship software — POTS, ME/CFS, fibromyalgia, Long COVID, EDS, and the rest of the invisible-disability spectrum. Also: career-rebuilders, late starters, and anyone who finds traditional bootcamps physically incompatible with their body."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Bedcoders cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "€12 per month for full access to all four tracks, AI feedback on exercises, and verifiable certificates. Cancel any month — your progress waits. Bad month? Pause the subscription. We don't punish crash days."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to know how to code already?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The Fundamentals track starts from zero. If you can read English and use a browser, you can start. The AI Literacy track is also beginner-friendly — you'll need the Claude API track before tackling Agents."
          }
        },
        {
          "@type": "Question",
          "name": "Will the certificate get me hired?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bedcoders certificates document completion of educational content. They are not a regulated qualification or licence. What gets people hired is the work you ship while taking the courses — and we structure exercises so you build a real portfolio, not just answers to multiple-choice questions."
          }
        },
        {
          "@type": "Question",
          "name": "Is the AI feedback actually useful, or just a gimmick?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open-ended exercises get reviewed by Claude (Anthropic's model) with rubrics we wrote. It's automated, so it's instant, but it's not magic — it tells you what's missing, what's wrong, and what to try next. You can request human review for any feedback you want a person to look at."
          }
        }
      ]
    }
    </script>
